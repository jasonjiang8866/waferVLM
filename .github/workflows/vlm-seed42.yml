name: WaferVLM seed 42 confirmation
on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: 'Use the extended US$30 / 1100-minute total authorization for independent VLM seed 42, 0-to-250 training'
        type: boolean
        required: true
        default: false
      expected_sha:
        description: 'Exact reviewed current main SHA'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: wafervlm-paid-usd20
  cancel-in-progress: false
jobs:
  experiment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 205
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline lifecycle and integrity tests
        run: python -m unittest discover -s runpod/tests -v
      - name: Install controller verification dependencies (CPU only)
        run: python -m pip install -e .
      - name: Fresh GET-only capacity, rate and account guardrails
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_controller preflight
      - name: Write one-off authorization ledger
        if: inputs.confirm_paid && github.run_attempt == 1
        run: |
          mkdir -p runpod-authorization
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('runpod-authorization/intent.json').write_text(json.dumps({
              'seed': 42, 'controller_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'workload': 'vlm-seed42'}))
          PYTHON
          printf '%s\n' "$GITHUB_RUN_ID" > runpod-authorization/run-id.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.confirm_paid && github.run_attempt == 1
        with:
          name: runpod-authorization-wafer-20261107-usd20
          path: runpod-authorization/
          retention-days: 90
          if-no-files-found: error
      - name: Train seed 42, verify full states, retrieve evidence, delete Pod
        if: inputs.confirm_paid
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CONFIRM_PAID: ${{ inputs.confirm_paid }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python -m runpod.vlm_controller run
      - name: Independent inventory check and cleanup
        if: always() && inputs.confirm_paid
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m runpod.vlm_controller cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wafervlm-seed42-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runpod-results/
            !runpod-results/historical-result.zip
          retention-days: 30
          if-no-files-found: warn
