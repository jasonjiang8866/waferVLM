name: Build seed confirmation image
on:
  pull_request:
    paths:
      - runpod/Dockerfile.confirmation
      - .github/workflows/confirmation-image.yml
      - src/**
      - scripts/**
      - tests/**
      - configs/seed-confirmation.json
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the confirmation image only; does not start a GPU
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: confirmation-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: runpod/Dockerfile.confirmation
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/jasonjiang8866/wafervlm:seed-confirmation-${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jasonjiang8866/wafervlm@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
