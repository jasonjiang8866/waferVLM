name: Build DINOv3 comparison image
on:
  pull_request:
    paths:
      - .dockerignore
      - runpod/**
      - .github/workflows/dinov3-image.yml
      - src/**
      - scripts/**
      - tests/**
      - configs/**
      - docs/showcase/checkpoint-250/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the DINOv3 worker image only; does not start a GPU
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: dinov3-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: runpod/Dockerfile.dinov3
          target: ${{ github.event_name == 'workflow_dispatch' && 'weighted' || 'runtime' }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/jasonjiang8866/wafervlm:dinov3-${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          secrets: |
            hf_token=${{ github.event_name == 'workflow_dispatch' && secrets.HF_TOKEN || '' }}
      - name: Record digest
        if: github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jasonjiang8866/wafervlm@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  offline-weights:
    # A trusted same-repository PR verifies actual gated bytes on CPU, with no
    # publication or RunPod allocation. Forks still run the secret-free tests.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile.dinov3
          target: weighted
          push: false
          build-args: SOURCE_SHA=${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
