name: Build DINOv3 comparison image
on:
  pull_request:
    paths:
      - .dockerignore
      - runpod/**
      - .github/workflows/dinov3-image.yml
      - src/**
      - scripts/**
      - tests/**
      - configs/**
      - docs/showcase/checkpoint-250/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the DINOv3 worker image only; does not start a GPU
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: dinov3-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: runpod/Dockerfile.dinov3
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/jasonjiang8866/wafervlm:dinov3-${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jasonjiang8866/wafervlm@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
