name: DINOv3 read-only preflight diagnosis
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Immutable DINO image to inspect; does not launch a GPU'
        type: string
        required: true
      image_source_sha:
        description: 'Exact source SHA embedded in that image'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: echo "HF_HOME=$RUNNER_TEMP/dinov3-hf" >> "$GITHUB_ENV"
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --extra train
      - name: Reproduce official CPU cache preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --frozen --extra train python scripts/run_dinov3.py preflight --output dinov3-results/weights
      - name: Observe stages without create or cleanup
        env:
          DINO_IMAGE: ${{ inputs.image }}
          DIAGNOSTIC_IMAGE_SOURCE_SHA: ${{ inputs.image_source_sha }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --extra train python -m runpod.dinov3_controller observe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dinov3-observation-${{ github.run_id }}
          path: dinov3-results/
          retention-days: 90
          if-no-files-found: error
