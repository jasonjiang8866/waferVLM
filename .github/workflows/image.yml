name: Build worker image
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the worker image to GHCR (does not create a RunPod Pod)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: runpod/Dockerfile
          push: ${{ inputs.publish }}
          tags: ghcr.io/jasonjiang8866/wafervlm:${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
      - name: Record immutable image reference
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jasonjiang8866/wafervlm@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
