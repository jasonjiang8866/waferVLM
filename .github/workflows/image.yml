name: Build worker image
on:
  pull_request:
    paths:
      - runpod/Dockerfile
      - .github/workflows/image.yml
      - pyproject.toml
      - uv.lock
      - src/**
      - scripts/**
      - tests/**
      - configs/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the worker image to GHCR (does not create a RunPod Pod)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify released checkpoint-200 and validation evidence
        run: python3 scripts/prepare_profile_parent.py --download --output profile-input
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: runpod/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ghcr.io/jasonjiang8866/wafervlm:${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
      - name: Record immutable image reference
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/jasonjiang8866/wafervlm@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
