name: CPU protocol and model compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vlm-receipt:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Reverify both fresh-seed archives and independent cleanup without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_ledger verify-completed
      - name: Stage and verify all six real checkpoint inputs without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_repeat_inputs --output vlm-receipt-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vlm-receipt-verification-${{ github.run_id }}
          path: |
            vlm-receipt-check/receipt-summary.json
            vlm-receipt-check/input-verification.json
          if-no-files-found: error
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -p test_protocol.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_showcase.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_confirmation.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_confirmation_archive.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_vlm_repeat_archive.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_dinov3_protocol.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_dinov3_archive.py -v
      - run: uv run --frozen wafervlm --help
      - run: python -m unittest discover -s runpod/tests -v
      - name: DINO tests remain offline with production scheduling inputs
        env:
          DINO_GPU: 'NVIDIA GeForce RTX 5090'
          PARALLEL_VLM_RUN_ID: '43562568201'
          REPLACE_QUEUED_RUN_ID: '43563592797'
        run: python -m unittest discover -s runpod/tests -p 'test_dinov3*.py' -v
  model-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --extra train
      - run: uv run --frozen --extra train python -m unittest discover -s tests -v
      - name: Pinned real tokenizer and image processor (no model weights)
        run: uv run --frozen --extra train python scripts/check_processor.py
      - name: Real Trainer integration with tiny random weights
        run: uv run --frozen --extra train python scripts/check_training.py
