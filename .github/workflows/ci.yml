name: CPU protocol and model compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vlm-receipt:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Reverify both fresh-seed archives and independent cleanup without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_ledger verify-completed
      - name: Check frozen holdout inputs and prior cleanup on CPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_holdout_inputs
      - name: Stage and verify all six real checkpoint inputs without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_repeat_inputs --output vlm-receipt-check
      - name: Verify the partial 14-pass archive and both cleanup receipts without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_repeat_resume verify --output vlm-receipt-check
      - name: Reconcile the capacity-rejected continuation without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_repeat_capacity --output vlm-receipt-check
      - name: Verify all 16 completed passes and the MIG timeout cleanup without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_repeat_resume verify-finish --output vlm-receipt-check
      - name: Reconcile final-two capacity rejection and both cleanup paths without a GPU
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_repeat_finish_capacity --output vlm-receipt-check
      - name: Verify allocated startup failure and independent cleanup (no RunPod credentials)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m runpod.vlm_repeat_startup_recovery --output vlm-receipt-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vlm-receipt-verification-${{ github.run_id }}
          path: |
            vlm-receipt-check/receipt-summary.json
            vlm-receipt-check/input-verification.json
            vlm-receipt-check/resume-verification.json
            vlm-receipt-check/capacity-recovery.json
            vlm-receipt-check/finish-verification.json
            vlm-receipt-check/finish-capacity-recovery.json
            vlm-receipt-check/startup-recovery.json
          if-no-files-found: error
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - name: Verify first-pass Qwen validation predictions and compute paired errors
        run: python analysis/qwen_validation_errors.py
      - run: uv run --frozen python -m unittest discover -s tests -p test_final_holdout.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_protocol.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_showcase.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_confirmation.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_confirmation_archive.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p 'test_vlm_repeat*.py' -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_dinov3_protocol.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p test_dinov3_archive.py -v
      - run: uv run --frozen python -m unittest discover -s runpod/study_tests -v
      - run: uv run --frozen python -m unittest discover -s analysis/tests -p test_dinov3_confirmation_report.py -v
      - name: Audit committed DINO holdout evidence (CPU only, no provider access)
        run: uv run --frozen python scripts/verify_dinov3_holdout_evidence.py
      - name: Regression-test freeze, ledger, cleanup and retention drift (offline)
        run: uv run --frozen python -m unittest discover -s analysis/tests -p test_dinov3_holdout_evidence.py -v
      - run: uv run --frozen wafervlm --help
      - run: python -m unittest discover -s runpod/tests -v
      - name: DINO tests remain offline with production scheduling inputs
        env:
          DINO_GPU: 'NVIDIA GeForce RTX 5090'
          PARALLEL_VLM_RUN_ID: '43562568201'
          REPLACE_QUEUED_RUN_ID: '43563592797'
        run: python -m unittest discover -s runpod/tests -p 'test_dinov3*.py' -v
  model-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --extra train
      - run: uv run --frozen --extra train python -m unittest discover -s tests -v
      - name: Pinned real tokenizer and image processor (no model weights)
        run: uv run --frozen --extra train python scripts/check_processor.py
      - name: Real Trainer integration with tiny random weights
        run: uv run --frozen --extra train python scripts/check_training.py
