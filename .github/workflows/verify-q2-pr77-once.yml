name: PR77 one-time unpaid dispatch verification
on:
  push:
    branches: [verify/q2-pr77-unpaid-20261125]
permissions: {}
jobs:
  verify:
    if: github.run_attempt == 1 && github.event.before == '70177014f2ba088a745358289f054010f5b37bdf'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 70177014f2ba088a745358289f054010f5b37bdf
          persist-credentials: false
      - name: Submit one unpaid feature-branch probe and recover its run by request ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/q2"
          bash scripts/qwen_q2_dispatch.sh submit "$dir" feat/qwen-q2-dispatch-receipt 70177014f2ba088a745358289f054010f5b37bdf || true
          jq -e '.inputs.confirm_paid == false' "$dir/request.json"
          cat "$dir/request.json" >> "$GITHUB_STEP_SUMMARY"
          if test -s "$dir/response.json"; then
            cat "$dir/response.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          for attempt in {1..5}; do
            if bash scripts/qwen_q2_dispatch.sh find "$dir" > "$RUNNER_TEMP/matched.json"; then
              cat "$RUNNER_TEMP/matched.json" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1
