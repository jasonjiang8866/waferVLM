name: DINOv3 official weight access preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dinov3-weight-preflight
  cancel-in-progress: false
jobs:
  weights:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check read credential availability without printing it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('HF_TOKEN'):
              raise SystemExit('Configure repository secret HF_TOKEN for an account with approved official DINOv3 access.')
          PY
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --extra train
      - name: Download and load pinned official weights on CPU
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ runner.temp }}/dinov3-hf
        run: uv run --frozen --extra train python scripts/run_dinov3.py preflight --output results/dinov3-preflight
      - name: Preserve hashes only, not gated weights or credentials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dinov3-weight-preflight-${{ github.run_id }}
          path: results/dinov3-preflight/*.json
          if-no-files-found: error
          retention-days: 30
