name: Qwen Q2 matched-area training pilot
run-name: Qwen Q2 ${{ inputs.confirm_paid && 'paid' || 'preflight' }} [${{ inputs.request_id || github.run_id }}]
on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: 'Use at most US$5 and 100 minutes of the existing Qwen campaign for this pilot'
        type: boolean
        default: false
        required: true
      request_id:
        description: 'Optional operator request ID for matching an ambiguous dispatch'
        type: string
        required: false
      expected_sha:
        description: 'Reviewed commit SHA for the selected ref'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.confirm_paid && 'wafervlm-paid-usd20' || format('qwen-q2-preflight-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  dispatch-receipt:
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CONFIRM_PAID: ${{ inputs.confirm_paid }}
    steps:
      - name: Record dispatch identity and verify the selected revision
        shell: bash
        run: |
          set -eu
          [[ -z "$REQUEST_ID" || "$REQUEST_ID" =~ ^[a-zA-Z0-9_-]{1,80}$ ]]
          printf 'Run URL: %s/%s/actions/runs/%s\nRevision: %s\nRequest: %s\nPaid requested: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_SHA" "${REQUEST_ID:-$GITHUB_RUN_ID}" "$CONFIRM_PAID" >> "$GITHUB_STEP_SUMMARY"
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRM_PAID" == false || "$GITHUB_REF" == refs/heads/main ]]
  experiment:
    needs: dispatch-receipt
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      WAFER_VLM_PHASE: q2-pilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Check live GPU inventory, image and budget without allocating
        env:
          GH_TOKEN: ${{ github.token }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m runpod.vlm_controller preflight
      - if: inputs.confirm_paid && github.run_attempt == 1
        run: echo "$GITHUB_RUN_ID" > q2-intent.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: marker
        if: inputs.confirm_paid && github.run_attempt == 1
        with:
          name: qwen-q2-pair-pilot-paid-v1
          path: q2-intent.txt
          if-no-files-found: error
          retention-days: 90
      - name: Run paired training and verify retrieved predictions
        if: inputs.confirm_paid
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CONFIRM_PAID: ${{ inputs.confirm_paid }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUTHORIZATION_ARTIFACT_ID: ${{ steps.marker.outputs.artifact-id }}
        run: python -m runpod.vlm_controller run
      - if: always() && inputs.confirm_paid
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m runpod.vlm_controller cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-q2-pilot-${{ github.run_id }}
          path: runpod-results/
          if-no-files-found: warn
          retention-days: 90
