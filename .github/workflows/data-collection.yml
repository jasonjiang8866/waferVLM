name: Wafer data collection checks
on:
  pull_request:
    paths: ['data_sources/**', 'scripts/*collection*.py', 'scripts/collect_wafer_data.py', '.github/workflows/data-collection.yml']
  push:
    branches: [main]
    paths: ['data_sources/**', 'scripts/*collection*.py', 'scripts/collect_wafer_data.py', '.github/workflows/data-collection.yml']
permissions:
  contents: read
jobs:
  collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s data_sources/tests -p 'test_*.py' -v
      - run: python scripts/collect_wafer_data.py plan --datasets carinthia-s silicon-wafer-pl silicon-wafer-ebsd
